name: Appium Test

on:
  workflow_dispatch:

jobs:
  appium-test:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # 4. Install Node.js
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # 5. Install Appium
      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

          echo "Appium version:"
          appium --version

          echo "Installed drivers:"
          appium driver list --installed


      # 6. Start Android emulator
      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            echo "Android emulator started successfully"

            echo "Connected devices:"
            adb devices

            echo "Android version:"
            adb shell getprop ro.build.version.release

            echo "Android API:"
            adb shell getprop ro.build.version.sdk

            echo "Starting Appium..."

            nohup appium \
              --address 127.0.0.1 \
              --port 4723 \
              > appium.log 2>&1 &

            echo "Waiting for Appium..."

            for i in {1..30}; do
              if curl --silent --fail http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium server is ready"
                break
              fi

              sleep 2
            done

            echo "Appium status:"
            curl --fail http://127.0.0.1:4723/status

            echo "Running FirstAppiumTest..."

            mvn -Dtest=FirstAppiumTest test


      # 7. Upload Appium logs
      - name: Upload Appium logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-logs
          path: appium.log