name: Appium Test

on:
  workflow_dispatch:

jobs:
  appium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "system-images;android-37;google_apis;x86_64"

      - name: Create Android emulator
        run: |
          echo "no" | avdmanager create avd \
            -n GitHub_Android_37 \
            -k "system-images;android-37;google_apis;x86_64" \
            --force

      - name: Start Android emulator
        run: |
          nohup emulator \
            -avd GitHub_Android_37 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &

          adb wait-for-device

          while [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]]; do
            sleep 5
          done

          adb shell input keyevent 82

      - name: Check Android device
        run: |
          adb devices
          adb shell getprop ro.build.version.sdk

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium server
        run: |
          nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &

          sleep 5

          curl --fail http://127.0.0.1:4723/status

      - name: Run FirstAppiumTest
        run: |
          mvn -Dtest=FirstAppiumTest test